<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degustazione Saison Oltrepò Pavese</title>
    <style>
        :root {
            --primary-color: #7B3F00;
            --primary-hover: #5e3000;
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e2d9cc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 650px;
            background: var(--card-bg);
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(123, 63, 0, 0.08);
            border: 1px solid var(--border-color);
        }
        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .logos-container img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 8px;
            background: #faf7f2;
            padding: 5px;
            border: 1px solid var(--border-color);
        }
        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .intro {
            font-size: 0.92rem;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
            background: #faf7f2;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }
        .highlight-box {
            background: #fff8f0;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #f3d6b8;
            margin-bottom: 25px;
        }
        .section {
            background: #fff;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.2s ease;
        }
        .section:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        label.question {
            font-weight: 600;
            display: block;
            margin-bottom: 12px;
            font-size: 0.98rem;
            color: var(--text-color);
        }
        .options-group, .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }
        .options-group label, .radio-group label {
            background: #faf9f6;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .options-group label:hover, .radio-group label:hover {
            background: #f0ebe1;
        }
        .scale-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #faf9f6;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }
        .scale-group label {
            font-size: 0.9rem;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
        }
        textarea, input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 5px;
            font-size: 0.95rem;
            background: #faf9f6;
        }
        textarea:focus, input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .success-msg {
            display: none;
            background-color: #edf7ed;
            color: #1e4620;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #c8e6c9;
            margin-top: 20px;
        }
        #prezzoContainer {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Spazio Loghi -->
    <div class="logos-container">
        <img src="hbl.png" alt="Logo HBL" onerror="this.style.display='none'">
        <img src="doppiobaffo.png" alt="Logo Doppiobaffo" onerror="this.style.display='none'">
        <img src="ubt.png" alt="Logo UBT" onerror="this.style.display='none'">
    </div>

    <h1>Saison Oltrepò Pavese</h1>
    <div class="intro">
        Prototipo in collaborazione con l'Università degli Studi di Pavia (con cereali del territorio e bargnolino). Valuta il prodotto secondo le tue preferenze.
    </div>

    <form id="degustazioneForm">
        
        <div class="highlight-box">
            <label class="question" for="versione_birra">Seleziona la versione che stai assaggiando *</label>
            <select id="versione_birra" required>
                <option value="">-- Scegli la versione --</option>
                <option value="Versione A">Versione A</option>
                <option value="Versione B">Versione B</option>
                <option value="Versione C">Versione C</option>
                <option value="Versione D">Versione D</option>
            </select>
        </div>

        <div class="section">
            <label class="question" for="nome">Nome o ID Assaggiatore (facoltativo)</label>
            <input type="text" id="nome" placeholder="Il tuo nome o nickname">
        </div>

        <!-- 1. Aspetto Rosato -->
        <div class="section">
            <label class="question">1. Ti piace l'aspetto rosato e la sua schiuma?</label>
            <div class="radio-group">
                <label><input type="radio" name="aspetto_si_no" value="SI"> SI</label>
                <label><input type="radio" name="aspetto_si_no" value="NO"> NO</label>
            </div>
            <label class="question" style="font-size:0.85rem; font-weight:normal; margin-top:15px; color:#555;">Valuta da 1 (non mi piace) a 5 (mi piace molto):</label>
            <div class="scale-group">
                <label><input type="radio" name="aspetto_voto" value="1"><br>1</label>
                <label><input type="radio" name="aspetto_voto" value="2"><br>2</label>
                <label><input type="radio" name="aspetto_voto" value="3"><br>3</label>
                <label><input type="radio" name="aspetto_voto" value="4"><br>4</label>
                <label><input type="radio" name="aspetto_voto" value="5"><br>5</label>
            </div>
        </div>

        <!-- 2. Profumo Floreale -->
        <div class="section">
            <label class="question">2. Profumo Floreale</label>
            <div class="options-group">
                <label><input type="radio" name="profumo_floreale_tipo" value="ASSENTE"> Assente</label>
                <label><input type="radio" name="profumo_floreale_tipo" value="DELICATO"> Delicato</label>
                <label><input type="radio" name="profumo_floreale_tipo" value="MEDIO"> Medio</label>
                <label><input type="radio" name="profumo_floreale_tipo" value="INTENSO"> Intenso</label>
            </div>
            <label class="question" style="font-size:0.85rem; font-weight:normal; margin-top:15px; color:#555;">Valuta da 1 a 5:</label>
            <div class="scale-group">
                <label><input type="radio" name="profumo_floreale_voto" value="1"><br>1</label>
                <label><input type="radio" name="profumo_floreale_voto" value="2"><br>2</label>
                <label><input type="radio" name="profumo_floreale_voto" value="3"><br>3</label>
                <label><input type="radio" name="profumo_floreale_voto" value="4"><br>4</label>
                <label><input type="radio" name="profumo_floreale_voto" value="5"><br>5</label>
            </div>
        </div>

        <!-- 3. Profumo Fruttato -->
        <div class="section">
            <label class="question">3. Profumo Fruttato</label>
            <div class="options-group">
                <label><input type="radio" name="profumo_fruttato_tipo" value="ASSENTE"> Assente</label>
                <label><input type="radio" name="profumo_fruttato_tipo" value="DELICATO"> Delicato</label>
                <label><input type="radio" name="profumo_fruttato_tipo" value="MEDIO"> Medio</label>
                <label><input type="radio" name="profumo_fruttato_tipo" value="INTENSO"> Intenso</label>
            </div>
            <label class="question" style="font-size:0.85rem; font-weight:normal; margin-top:15px; color:#555;">Valuta da 1 a 5:</label>
            <div class="scale-group">
                <label><input type="radio" name="profumo_fruttato_voto" value="1"><br>1</label>
                <label><input type="radio" name="profumo_fruttato_voto" value="2"><br>2</label>
                <label><input type="radio" name="profumo_fruttato_voto" value="3"><br>3</label>
                <label><input type="radio" name="profumo_fruttato_voto" value="4"><br>4</label>
                <label><input type="radio" name="profumo_fruttato_voto" value="5"><br>5</label>
            </div>
        </div>

        <!-- 4. Corposità -->
        <div class="section">
            <label class="question">4. Corposità</label>
            <div class="options-group">
                <label><input type="radio" name="corposita_tipo" value="ACQUOSA"> Acquosa</label>
                <label><input type="radio" name="corposita_tipo" value="MEDIO CORPO"> Medio corpo</label>
                <label><input type="radio" name="corposita_tipo" value="MOLTO CORPOSA"> Molto corposa</label>
            </div>
            <label class="question" style="font-size:0.85rem; font-weight:normal; margin-top:15px; color:#555;">Valuta da 1 a 5:</label>
            <div class="scale-group">
                <label><input type="radio" name="corposita_voto" value="1"><br>1</label>
                <label><input type="radio" name="corposita_voto" value="2"><br>2</label>
                <label><input type="radio" name="corposita_voto" value="3"><br>3</label>
                <label><input type="radio" name="corposita_voto" value="4"><br>4</label>
                <label><input type="radio" name="corposita_voto" value="5"><br>5</label>
            </div>
        </div>

        <!-- 5. Gusto Fruttato -->
        <div class="section">
            <label class="question">5. Gusto Fruttato</label>
            <div class="options-group">
                <label><input type="radio" name="gusto_fruttato_tipo" value="ASSENTE"> Assente</label>
                <label><input type="radio" name="gusto_fruttato_tipo" value="DELICATO"> Delicato</label>
                <label><input type="radio" name="gusto_fruttato_tipo" value="MEDIO"> Medio</label>
                <label><input type="radio" name="gusto_fruttato_tipo" value="INTENSO"> Intenso</label>
            </div>
            <label class="question" style="font-size:0.85rem; font-weight:normal; margin-top:15px; color:#555;">Valuta da 1 a 5:</label>
            <div class="scale-group">
                <label><input type="radio" name="gusto_fruttato_voto" value="1"><br>1</label>
                <label><input type="radio" name="gusto_fruttato_voto" value="2"><br>2</label>
                <label><input type="radio" name="gusto_fruttato_voto" value="3"><br>3</label>
                <label><input type="radio" name="gusto_fruttato_voto" value="4"><br>4</label>
                <label><input type="radio" name="gusto_fruttato_voto" value="5"><br>5</label>
            </div>
        </div>

        <!-- 6. Retrogusto (Multi-selezione con Checkbox) -->
        <div class="section">
            <label class="question">6. Retrogusto (puoi selezionare più elementi)</label>
            <div class="options-group">
                <label><input type="checkbox" name="retrogusto" value="MALTATO"> Maltato</label>
                <label><input type="checkbox" name="retrogusto" value="AMARO"> Amaro</label>
                <label><input type="checkbox" name="retrogusto" value="FRUTTATO"> Fruttato</label>
                <label><input type="checkbox" name="retrogusto" value="SPEZIATO"> Speziato</label>
                <label><input type="checkbox" name="retrogusto" value="ALTRO"> Altro</label>
            </div>
            <label class="question" style="font-size:0.85rem; font-weight:normal; margin-top:15px; color:#555;">Valuta da 1 a 5:</label>
            <div class="scale-group">
                <label><input type="radio" name="retrogusto_voto" value="1"><br>1</label>
                <label><input type="radio" name="retrogusto_voto" value="2"><br>2</label>
                <label><input type="radio" name="retrogusto_voto" value="3"><br>3</label>
                <label><input type="radio" name="retrogusto_voto" value="4"><br>4</label>
                <label><input type="radio" name="retrogusto_voto" value="5"><br>5</label>
            </div>
        </div>

        <!-- 7. Valutazioni Finali -->
        <div class="section">
            <label class="question">7. Secondo te, è abbastanza bargnolinosa?</label>
            <div class="radio-group">
                <label><input type="radio" name="abbastanza_bargnolinosa" value="SI"> SI</label>
                <label><input type="radio" name="abbastanza_bargnolinosa" value="NO"> NO</label>
            </div>
        </div>

        <!-- 8. Intento d'acquisto e prezzo condizionale -->
        <div class="section">
            <label class="question">8. La compreresti?</label>
            <div class="radio-group">
                <label><input type="radio" name="compreresti" value="SI" onclick="togglePrezzo(true)"> SI</label>
                <label><input type="radio" name="compreresti" value="NO" onclick="togglePrezzo(false)"> NO</label>
            </div>
            
            <div id="prezzoContainer">
                <label class="question" style="font-size:0.9rem; margin-bottom:8px;">Se sì, quanto saresti disposto a spendere (bott. 33cl)?:</label>
                <div class="options-group" style="flex-direction: column; gap: 8px;">
                    <label><input type="radio" name="prezzo_disposto" value="2-3 euro"> Da 2 a 3 euro</label>
                    <label><input type="radio" name="prezzo_disposto" value="3-4 euro"> Da 3 a 4 euro</label>
                    <label><input type="radio" name="prezzo_disposto" value="4-5 euro"> Da 4 a 5 euro</label>
                </div>
            </div>
        </div>

        <div class="section">
            <label class="question" for="note">Note / Consigli</label>
            <textarea id="note" rows="3" placeholder="Eventuali commenti o osservazioni..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Invia Scheda di Degustazione</button>
    </form>

    <div id="successMessage" class="success-msg">
        <p>Scheda inviata con successo! Grazie per la valutazione. 🍻</p>
        <button type="button" id="resetBtn" onclick="location.reload();" style="margin-top: 15px; background-color: #27ae60;">Valuta un'altra birra</button>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz3sCQGgsuAKKJ1XUdeB6XOMa_JFfEkSvrr3HI2gouFQFTJuOZZd_7UZbHYc-tk31PC/exec";

    function togglePrezzo(mostra) {
        const container = document.getElementById('prezzoContainer');
        container.style.display = mostra ? 'block' : 'none';
        if (!mostra) {
            // Svuota la selezione del prezzo se l'utente seleziona "NO"
            document.querySelectorAll('input[name="prezzo_disposto"]').forEach(el => el.checked = false);
        }
    }

    document.getElementById('degustazioneForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = "Invio in corso...";

        const getRadioVal = (name) => {
            const el = document.querySelector(`input[name="${name}"]:checked`);
            return el ? el.value : "";
        };

        // Raccolta dei checkbox selezionati per il retrogusto (uniti da virgola)
        const getCheckboxesVal = (name) => {
            const checkboxes = document.querySelectorAll(`input[name="${name}"]:checked`);
            let values = [];
            checkboxes.forEach((cb) => values.push(cb.value));
            return values.join(', ');
        };

        const dati = {
            timestamp: new Date().toISOString(),
            versione_birra: document.getElementById('versione_birra').value,
            nome: document.getElementById('nome').value,
            aspetto_si_no: getRadioVal('aspetto_si_no'),
            aspetto_voto: getRadioVal('aspetto_voto'),
            profumo_floreale_tipo: getRadioVal('profumo_floreale_tipo'),
            profumo_floreale_voto: getRadioVal('profumo_floreale_voto'),
            profumo_fruttato_tipo: getRadioVal('profumo_fruttato_tipo'),
            profumo_fruttato_voto: getRadioVal('profumo_fruttato_voto'),
            corposita_tipo: getRadioVal('corposita_tipo'),
            corposita_voto: getRadioVal('corposita_voto'),
            gusto_fruttato_tipo: getRadioVal('gusto_fruttato_tipo'),
            gusto_fruttato_voto: getRadioVal('gusto_fruttato_voto'),
            retrogusto: getCheckboxesVal('retrogusto'),
            retrogusto_voto: getRadioVal('retrogusto_voto'),
            abbastanza_bargnolinosa: getRadioVal('abbastanza_bargnolinosa'),
            compreresti: getRadioVal('compreresti'),
            prezzo_disposto: getRadioVal('prezzo_disposto'),
            note: document.getElementById('note').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(dati)
        })
        .then(response => response.text())
        .then(data => {
            document.getElementById('degustazioneForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        })
        .catch(error => {
            console.error('Errore:', error);
            alert("Errore durante l'invio dei dati. Riprova.");
            btn.disabled = false;
            btn.textContent = "Invia Scheda di Degustazione";
        });
    });
</script>

</body>
</html>
